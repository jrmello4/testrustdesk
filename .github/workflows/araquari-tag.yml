name: Flutter Tag Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: Release tag
        required: true
        default: v1.5.0-1

permissions:
  contents: write
  actions: read
  checks: read
  id-token: write

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || github.ref_name }}
      build-macos: false