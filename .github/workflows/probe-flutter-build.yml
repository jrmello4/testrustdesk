name: Probe Flutter Build
on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: Release tag
        required: true
        default: v1.5.0-1

permissions:
  contents: write
  actions: read
  checks: read
  id-token: write

jobs:
  call:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      build-macos: false
    secrets: inherit