name: Probe Flutter Build
on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: Release tag
        required: true
        default: v1.5.0-1
jobs:
  call:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      build-macos: false
    secrets: inherit